description = "Simple FTP server with GUI with python - with windows exe"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=50.0.0",
    "imageio>=2.37.3",
    "nuitka>=4.3.1",
    "pillow>=13.0.0",
    "aioftp>=0.28.3",
    "pyinstaller>=6.22.0",
    "pyqtdarktheme-fork>=2.3.6",
    "pyside6>=6.12.0",
]
